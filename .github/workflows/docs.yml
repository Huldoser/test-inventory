name: Docs

# Deploys the docs site by hand, so that a docs fix can ship between releases. It builds the docs of the latest release
# tag. The `ref` input builds another tag, branch or commit instead, such as main when it has only docs fixes since the
# last release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to build; empty for the latest release tag
        required: false
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Each page's "last updated" date comes from its last commit, and the tags are needed to find the release.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the release
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            # Prereleases, such as v0.2.0-beta.1, have a hyphen and are left out. awk reads every line, so the pipe
            # never closes early, and prints nothing when there is no release.
            REF=$(git tag --list 'v*' --sort=-version:refname | awk '!/-/ && !found { print; found = 1 }')
            if [ -z "$REF" ]; then
              echo "::error::There is no release tag yet."
              exit 1
            fi
          fi
          commit=$(git rev-parse --verify --quiet --end-of-options "$REF^{commit}" ||
            git rev-parse --verify --quiet --end-of-options "origin/$REF^{commit}") || {
            echo "::error::$REF is not a tag, branch or commit of this repository."
            exit 1
          }
          git checkout --quiet --detach "$commit"
          echo "Docs built from $REF, commit $commit." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Install scripts of dependencies never run here; none of them needs one.
      - run: npm ci --ignore-scripts
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy the docs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
